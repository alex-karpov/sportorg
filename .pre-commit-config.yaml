# Git hooks run the same project commands as scripts/check.py and CI; tool versions come from uv.lock.
# Install once: uvx --python 3.14 pre-commit@4.7.0 install
# (pre-commit is a tool, not a project dependency: ADR-0004. Python and version are pinned: a bare `uvx pre-commit`
#  may pick a newer interpreter (3.15) for which pyyaml has no wheel.)
# Excluded: deliberately broken fixtures and frozen tool-output copies in docs/evidence (scripts/check.py does not
# lint them either); needed here because pre-commit passes explicit file names.
exclude: ^(scripts/typecheck_(fixtures|configs)/|docs/evidence/)
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: uv run --no-sync ruff format --check --force-exclude
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types: [python]
      - id: basedpyright
        name: basedpyright (changed files)
        entry: uv run --no-sync basedpyright
        language: system
        types: [python]
      - id: lint-imports
        name: import-linter contracts
        entry: uv run --no-sync lint-imports
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml)$
      - id: uv-lock
        name: uv.lock is up to date
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: golden-commit-msg
        name: golden files need the maintainer's trailer (ADR-0008)
        entry: uv run --no-sync python -m scripts.golden_guard commit-msg
        language: system
        stages: [commit-msg]
        always_run: true
      - id: golden-range
        name: golden guard over unpushed commits (on push)
        entry: uv run --no-sync python scripts/check.py --only golden
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: protected-files
        name: protected files changed (review the diff; ADR-0008 condition 3)
        entry: uv run --no-sync python -m scripts.golden_guard protected
        language: system
        pass_filenames: false
        always_run: true
        verbose: true   # informational: print the list even though the hook never fails
        stages: [pre-push]
      - id: tests
        name: pytest (on push)
        entry: uv run --no-sync python scripts/check.py --only tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
